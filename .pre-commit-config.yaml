repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.10
  hooks:
    # Run the linter.
    - id: ruff
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/gitleaks/gitleaks
  # Matches the pinned CLI version the CI secret-scan job installs.
  rev: v8.30.1
  hooks:
    - id: gitleaks
