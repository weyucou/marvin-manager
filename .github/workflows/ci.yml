name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # moto runs in-process: no LocalStack container, no Docker daemon, no
      # network. These only satisfy botocore's credential lookup.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout
        # SHA pinned to v4.2.2 — update via: gh release view -R actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        # SHA pinned to v6.3.0 — update via: gh release view -R actions/setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v

      - name: Integration tests
        run: uv run pytest tests/integration -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA pinned to v4.2.2 — update via: gh release view -R actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose
